services:
  gateway:
    build: ./gateway
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    networks:
      - pi-net
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "test", "-f", "/run/firewall-ready"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: "no"

  pi:
    build:
      context: ./pi
      args:
        PI_UID: ${PI_UID:-1000}
        PI_GID: ${PI_GID:-1000}
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=4096m
    stdin_open: true
    tty: true
    environment:
      # Selects the host X server exposed through the socket bind below.
      DISPLAY: ${DISPLAY:-:0}
      # Gives X11 clients the cookie mounted from the host below.
      XAUTHORITY: /home/pi/.Xauthority
    volumes:
      - type: bind
        # Defaults to the directory the command is run from.
        source: ${PI_WORKSPACE:-${PWD}}
        target: /workspace
      - type: volume
        source: pi-cache
        target: /cache
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /home/pi/.Xauthority
        read_only: true
      - /prjs/teamwork:/teamwork:ro
    working_dir: /workspace

networks:
  pi-net:
    driver: bridge

volumes:
  pi-cache:
